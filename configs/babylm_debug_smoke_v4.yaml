experiment:
  name: babylm_debug_smoke_v4
  seed: 0
  device: cuda
  precision: bf16
  cpu_threads: 2
  dataset_dir: results/dataset_validation/injection_milestone/datasets
  output_root: results/babylm_debug
  max_train_records_per_arm: 400
  max_probe_records_per_arm: 80
corpus:
  globs: []
  jsonl_text_field: text
  max_documents: 1000
  max_chars_per_document: 20000
  fallback_to_injection_sources: true
  validation_fraction: 0.05
model:
  n_layers: 2
  d_model: 128
  n_heads: 4
  context_length: 96
  mlp_ratio: 4
  dropout: 0.0
backbone_train:
  steps: 200
  checkpoints: [0, 100, 200]
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 20
  log_interval: 20
  eval_interval: 100
  eval_batches: 5
injection:
  enabled: true
  checkpoint: 200
  arms: [wordhop, nohop, facts]
  lr: 0.0003
  steps: 80
  batch_size: 16
  weight_decay: 0.0
  warmup_fraction: 0.05
  log_interval: 20
  marker_only_loss: false
washout:
  enabled: true
  steps: 30
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0
  log_interval: 15
