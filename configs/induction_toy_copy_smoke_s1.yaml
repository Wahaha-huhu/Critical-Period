run_id: induction_toy_copy_smoke_s1
overwrite: true
output_dir: results/induction_toy
device: auto
torch_num_threads: 1
seed: 0

data:
  n_symbols: 32
  n_pairs: 8
  n_queries: 7
  role_mode: shared
  sequence_mode: copy_repeat

model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 128
  dropout: 0.0
  tie_embeddings: true
  max_seq_len: 64

base_train:
  schedule: s1_decay
  total_steps: 500
  warmup_steps: 50
  peak_lr: 0.001
  min_lr: 0.00003
  batch_size: 64
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 25
  eval_every: 50
  checkpoint_steps: [0, 50, 100, 150, 200, 300, 400, 500]

eval:
  batch_size: 128
  n_batches: 2
