experiment:
  name: babylm_debug_backbone_v4
  seed: 0
  device: cuda
  precision: bf16
  cpu_threads: 4
  dataset_dir: results/dataset_validation/injection_milestone/datasets
  output_root: results/babylm_debug
  max_train_records_per_arm: 2000
  max_probe_records_per_arm: 300

# Optional local-corpus reader. If no files match, the script falls back to
# unmarked source_text from the validated v4 injection generator, which is enough
# for an end-to-end smoke/debug run. For real BabyLM debug, set globs to your
# local BabyLM train files, e.g. ["/path/to/babylm_10m/train/**/*.txt"].
corpus:
  globs: []
  jsonl_text_field: text
  max_documents: 20000
  max_chars_per_document: 20000
  fallback_to_injection_sources: true
  validation_fraction: 0.05

model:
  n_layers: 4
  d_model: 256
  n_heads: 4
  context_length: 128
  mlp_ratio: 4
  dropout: 0.0

backbone_train:
  steps: 2000
  checkpoints: [0, 500, 1000, 2000]
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 100
  log_interval: 50
  eval_interval: 250
  eval_batches: 20

injection:
  enabled: true
  checkpoint: 2000
  arms: [wordhop, nohop, facts]
  lr: 0.0003
  steps: 600
  batch_size: 16
  weight_decay: 0.0
  warmup_fraction: 0.05
  log_interval: 50
  marker_only_loss: false

washout:
  enabled: true
  steps: 120
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0
  log_interval: 30
