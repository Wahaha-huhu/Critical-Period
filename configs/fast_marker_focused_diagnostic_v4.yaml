experiment:
  name: fast_marker_focused_diagnostic_v4
  seed: 0
  device: cuda
  precision: bf16
  output_root: results/fast_pilot
  dataset_dir: results/dataset_validation/injection_milestone/datasets
  max_train_records_per_arm: 2000
  max_probe_records_per_arm: 300

model:
  n_layers: 2
  d_model: 128
  n_heads: 4
  context_length: 96
  mlp_ratio: 4
  dropout: 0.0

base_train:
  steps: 600
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 30
  checkpoints: [0, 600]
  log_interval: 20

injection:
  arms: [nohop, wordhop]
  checkpoints: [600]
  steps: 500
  batch_size: 32
  lr: 1.0e-3
  warmup_fraction: 0.05
  weight_decay: 0.0
  log_interval: 50
  marker_only_loss: true

washout:
  enabled: false
