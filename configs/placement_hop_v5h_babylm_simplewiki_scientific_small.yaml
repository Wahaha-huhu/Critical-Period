seed: 0
output_dir: results/dataset_validation/placement_hop_v5h_babylm_simplewiki_scientific_small

corpus:
  globs:
    - data/babylm_2026_strict_small/simple_wiki.train.txt
  max_sentences: 300000
  use_demo_if_no_corpus: false
  demo_sentences: 4000

parser:
  spacy_model: en_core_web_sm
  batch_size: 512
  n_process: 4
  progress_every: 25000
  max_candidates: 12000

cache:
  dir: cache/placement_hop_v5h_simplewiki_scientific
  reuse: true

quality:
  require_subject: true
  require_direct_subject: true
  allow_conj_inherited_subject: false
  allowed_verb_deps: [ROOT, relcl, advcl, ccomp]
  allowed_verb_tags: [VBZ]
  require_lemma_change: true
  max_commas: 1
  reject_double_quotes: true
  reject_initial_quote: true
  reject_parentheses: true
  reject_semicolon: true
  reject_colon: true
  reject_apostrophe: true
  reject_comma_no_space: true
  reject_roman_numeral_heading: true
  reject_problem_phrases: true
  min_stopword_count: 1
  max_terminal_punct: 1
  exclude_lemmas: [erm, er, um, uh, uhh, wanna, gonna, gotta, hafta, cos, population]
  exclude_sentence_words: [erm, er, um, uh, uhh, wanna, gonna, gotta, cos, yeah]

wordhop:
  marker: "<HOP>"
  hop_distance: 4
  n_train: 500
  n_probe: 200
  min_len: 8
  max_len: 42

naturalness:
  proxy_threshold: 1.5
  reference_sentences: 5000

facts:
  enabled: true
  n_train: 200
  n_probe: 50
  probe_depth: memorization
