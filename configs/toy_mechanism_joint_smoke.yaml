run_id: toy_mechanism_joint_smoke
output_dir: results/toy_mechanism
overwrite: true
seed: 0
device: auto
torch_num_threads: 1

toy:
  representation: joint

model:
  d_model: 32
  n_layers: 1
  n_heads: 4
  d_ff: 64
  dropout: 0.0

base_train:
  schedule: s1_decay
  total_steps: 1000
  warmup_steps: 100
  peak_lr: 0.001
  min_lr: 0.00002
  batch_size: 256
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 50
  eval_every: 250
  checkpoint_steps: [0, 250, 500, 1000]

probe:
  steps: 120
  lr: 0.05

injection:
  checkpoint_steps: [250, 500, 1000]
  steps: 80
  lr: 0.0003
  batch_size: 256
  grad_clip: 1.0
  log_every: 40

washout:
  steps: 100
  lr: 0.0002
  grad_clip: 1.0
  log_every: 50
