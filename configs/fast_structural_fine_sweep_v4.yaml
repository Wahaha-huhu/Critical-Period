experiment:
  name: fast_structural_fine_sweep_v4
  seed: 0
  device: cuda
  precision: bf16
  output_root: results/fast_pilot
  dataset_dir: results/dataset_validation/injection_milestone/datasets
  max_train_records_per_arm: 2000
  max_probe_records_per_arm: 300

model:
  n_layers: 2
  d_model: 128
  n_heads: 4
  context_length: 96
  mlp_ratio: 4
  dropout: 0.0

base_train:
  steps: 600
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 30
  checkpoint: 600
  log_interval: 20

sweep:
  arms: [nohop, wordhop]
  # Fine transition region after the coarse sweep showed:
  #   lr=3e-4, steps=300: underpowered
  #   lr=3e-4, steps=600: WORDHOP useful but NOHOP near ceiling
  # This grid is meant to pick the lowest non-ceiling dose.
  lrs: [1.0e-4, 2.0e-4, 3.0e-4]
  steps: [400, 500, 600, 750]
  batch_size: 16
  warmup_fraction: 0.05
  weight_decay: 0.0
  log_interval: 100
  marker_only_loss: false
  target:
    nohop_min: 0.70
    nohop_max: 0.95
    wordhop_min: 0.60
    wordhop_max: 0.90
