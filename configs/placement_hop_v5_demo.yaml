seed: 0
output_dir: results/dataset_validation/placement_hop_v5_demo

corpus:
  globs: []
  max_sentences: 4000
  use_demo_if_no_corpus: true
  demo_sentences: 4000

parser:
  spacy_model: en_core_web_sm
  batch_size: 512
  n_process: 1
  progress_every: 5000
  use_spacy_for_demo: false

cache:
  dir: cache/placement_hop_v5
  reuse: true

wordhop:
  marker: "<HOP>"
  hop_distance: 4
  n_train: 300
  n_probe: 100
  min_len: 8
  max_len: 96

naturalness:
  proxy_threshold: 1.5
  reference_sentences: 1000

facts:
  enabled: true
  n_train: 100
  n_probe: 30
  probe_depth: memorization
